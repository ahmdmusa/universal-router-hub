<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Router Hub</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <!-- Apple Header -->
        <header class="popup-header">
            <div class="header-brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="14" width="20" height="8" rx="3"></rect>
                        <line x1="6" y1="18" x2="6.01" y2="18"></line>
                        <line x1="10" y1="18" x2="10.01" y2="18"></line>
                        <line x1="14" y1="18" x2="14.01" y2="18"></line>
                        <line x1="6" y1="10" x2="6" y2="14"></line>
                        <line x1="18" y1="10" x2="18" y2="14"></line>
                    </svg>
                </div>
                <div>
                    <h1 id="pop-title">Universal Router Hub</h1>
                    <p class="subtitle" id="pop-subtitle">لوحة التحكم الموحدة للراوترات</p>
                </div>
            </div>
            <div class="header-controls">
                <button class="icon-toggle-btn" id="btn-pop-lang" title="Language">EN</button>
                <button class="icon-toggle-btn" id="btn-pop-theme" title="Theme">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
                <span class="status-badge" id="status-badge">نشط</span>
            </div>
        </header>

        <!-- Router Model Selector -->
        <div class="section-card">
            <label class="section-label" for="router-model-select">نوع وموديل الراوتر</label>
            <select class="custom-select" id="router-model-select">
                <option value="auto" selected>كشف تلقائي ذكي (Smart Auto-Detect)</option>
                
                <optgroup label="D-Link">
                    <option value="dlink_245ge">D-Link DSL-245GE (المعدل)</option>
                    <option value="dlink_224">D-Link DSL-224 (VDSL2)</option>
                    <option value="dlink_124">D-Link DSL-124 (ADSL2+)</option>
                    <option value="dlink_2750u">D-Link DSL-2750U</option>
                    <option value="dlink_dir825">D-Link DIR-825 (Gigabit)</option>
                </optgroup>

                <optgroup label="ZTE / المصرية للاتصالات WE">
                    <option value="zte_h168n">ZTE ZXHN H168N (راوتر WE الأساسي)</option>
                    <option value="zte_h188a">ZTE ZXHN H188A (SuperVectoring)</option>
                    <option value="zte_h153">WE Air 5G (H153)</option>
                    <option value="zte_f601">ZTE F601 (Fiber ONT)</option>
                    <option value="zte_h108n">ZTE ZXHN H108N (ADSL)</option>
                </optgroup>

                <optgroup label="Huawei / فودافون / أورنج">
                    <option value="huawei_dg8045">Huawei DG8045 (WE VDSL)</option>
                    <option value="huawei_hg630">Huawei HG630 V2</option>
                    <option value="huawei_dn8245">Huawei DN8245V</option>
                    <option value="huawei_hg8245h">Huawei HG8245H (فايبر FTTH)</option>
                    <option value="huawei_b311">Huawei B311 (Orange 4G)</option>
                    <option value="huawei_b315">Huawei B315 (Vodafone 4G)</option>
                </optgroup>

                <optgroup label="TP-Link">
                    <option value="tplink_c6">TP-Link Archer C6 (Gigabit)</option>
                    <option value="tplink_vr600">TP-Link Archer VR600 (VDSL)</option>
                    <option value="tplink_vn020">TP-Link VN020-F3 (WE)</option>
                    <option value="tplink_wr841n">TP-Link TL-WR841N</option>
                    <option value="tplink_wr940n">TP-Link TL-WR940N</option>
                </optgroup>

                <optgroup label="Tenda, Mercusys & ASUS">
                    <option value="tenda_f3">Tenda F3</option>
                    <option value="tenda_ac10">Tenda AC10 (Gigabit)</option>
                    <option value="mercusys_ac10">Mercusys AC10</option>
                    <option value="asus_ac1200">ASUS RT-AC1200</option>
                </optgroup>
            </select>
            <p class="section-hint" id="detected-model-info">جارٍ الاتصال بالشبكة المحلية...</p>
        </div>

        <!-- Quick Actions -->
        <div class="actions-stack">
            <button class="action-btn primary" id="btn-open-hub">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
                <span>فتح لوحة تحكم الراوتر</span>
            </button>

            <button class="action-btn family" id="btn-family-dns">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <span>حماية الأسرة (Cloudflare 1.1.1.3)</span>
            </button>

            <button class="action-btn limiter" id="btn-speed-limit">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
                <span>توفير الباقة (تقييد السرعة ~5 Mbps)</span>
            </button>

            <button class="action-btn full-speed" id="btn-full-speed">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
                <span>فتح السرعة القصوى (Full Speed)</span>
            </button>

            <button class="action-btn danger" id="btn-reboot">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                    <line x1="12" y1="2" x2="12" y2="12"></line>
                </svg>
                <span>إعادة تشغيل الراوتر (Reboot)</span>
            </button>
        </div>

        <!-- Gateway IP Info -->
        <div class="footer-row">
            <span>عنوان البوابة (Gateway IP):</span>
            <input type="text" class="ip-input" id="gateway-ip" value="192.168.1.1">
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
